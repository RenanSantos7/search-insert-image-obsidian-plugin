name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Build plugin
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build
                  pnpm test
                  pnpm lint

            - name: Validate release version and artifacts
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
                  if [ "$TAG_NAME" != "$manifest_version" ]; then
                    echo "Tag $TAG_NAME does not match manifest version $manifest_version."
                    exit 1
                  fi

                  test -s main.js
                  test -s manifest.json

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  assets=(main.js manifest.json)
                  if [ -f styles.css ]; then
                    assets+=(styles.css)
                  fi

                  gh release create "$TAG_NAME" \
                    --title="$TAG_NAME" \
                    --draft \
                    "${assets[@]}"
